# 基础 IM 单机部署参考配置文件
# 包含组件：
# * MySQL 8.0 数据库
# * IM 单机服务器 (im-0)
# * IM 监控指标导出器 (exporter-0)

version: '3.8'

# IM 基础配置模板
x-im:
  &im-base
  depends_on:
    - db
  image: im/im:latest
  platform: linux/amd64
  restart: always

# IM 环境变量基础模板
x-im-env-vars: &im-env-vars
  # 指定使用的数据库适配器 (mysql, postgres, mongodb, rethinkdb)
  "STORE_USE_ADAPTER": "mysql"
  # Go 性能分析 pprof 路径
  "PPROF_URL": "/pprof"
  # 可通过设置 EXT_CONFIG 并挂载本地配置文件覆盖默认配置：
  # "EXT_CONFIG": "/etc/im/im.conf"
  # 等待数据库服务启动的可达地址 (HOST:PORT)
  "WAIT_FOR": "mysql:3306"
  
  # --- 推送通知配置 ---
  # IM 推送网关 (TNPG) 配置
  "TNPG_PUSH_ENABLED": "false"
  # "TNPG_USER": "<用户名>"
  # "TNPG_AUTH_TOKEN": "<认证Token>"
  
  # Google FCM 服务端推送配置
  "FCM_PUSH_ENABLED": "false"
  # "FCM_CRED_FILE": "<FCM服务账号JSON凭据路径>"
  # "FCM_INCLUDE_ANDROID_NOTIFICATION": false
  
  # FCM Web 客户端推送配置
  "FCM_API_KEY": "AIzaSyD6X4ULR-RUsobvs1zZ2bHdJuPz39q2tbQ"
  "FCM_APP_ID": "1:114126160546:web:aca6ea2981feb81fb44dfb"
  "FCM_PROJECT_ID": "im-1000"
  "FCM_SENDER_ID": 114126160546
  "FCM_VAPID_KEY": "BOgQVPOMzIMXUpsYGpbVkZoEBc0ifKY_f2kSU5DNDGYI6i6CoKqqxDd7w7PJ3FaGRBgVGJffldETumOx831jl58"
  "FCM_MEASUREMENT_ID": "G-WNJDQR34L3"
  
  # iOS Universal Links 配置
  # "IOS_UNIV_LINKS_APP_ID": "<ios universal links app id>"
  
  # --- WebRTC 视频通话配置 ---
  "WEBRTC_ENABLED": "false"
  # "ICE_SERVERS_FILE": "<ICE/STUN/TURN服务器配置文件路径>"

# Exporter 监控导出器环境变量模板
x-exporter-env-vars: &exporter-env-vars
  # IM 统计指标暴露接口
  "IM_ADDR": "http://im.host:6060/stats/expvar/"
  # InfluxDB 监控推模式配置：
  "SERVE_FOR": "influxdb"
  "INFLUXDB_VERSION": 1.7
  "INFLUXDB_ORGANIZATION": "<你的组织名称>"
  "INFLUXDB_PUSH_INTERVAL": 30
  "INFLUXDB_PUSH_ADDRESS": "https://mon.im.co/intake"
  "INFLUXDB_AUTH_TOKEN": "<认证Token>"
  # Prometheus 监控拉模式配置：
  # "SERVE_FOR": "prometheus"
  # "PROM_NAMESPACE": "im"
  # "PROM_METRICS_PATH": "/metrics"

services:
  # MySQL 数据库服务
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    # 如需持久化数据，请取消下述注释并配置本地目录：
    # volumes:
    #   - <本地数据存储目录>:/var/lib/mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    security_opt:
      - seccomp=unconfined

  # IM 单机主服务
  im-0:
    << : *im-base
    container_name: im-0
    hostname: im-0
    # 如需挂载自定义文件，请取消注释：
    # volumes:
    #   # 挂载自定义配置文件
    #   - <im.conf路径>:/etc/im/im.conf
    #   # 挂载日志保存目录
    #   - <日志目录路径>:/var/log
    ports:
      - "6060:6060"
    environment:
      << : *im-env-vars
      # 传入 RESET_DB=true 可强行重置数据库
      "RESET_DB": ${RESET_DB:-false}
      # 传入 UPGRADE_DB=true 可自动升级数据库 Schema
      "UPGRADE_DB": ${UPGRADE_DB:-false}

  # 监控指标导出器服务（与 im-0 配对）
  exporter-0:
    container_name: exporter-0
    hostname: exporter-0
    depends_on:
      - im-0
    image: im/exporter:latest
    platform: linux/amd64
    restart: always
    ports:
      - "6222:6222"
    links:
      - im-0:im.host
    environment:
      << : *exporter-env-vars
      "WAIT_FOR": "im-0:6060"
