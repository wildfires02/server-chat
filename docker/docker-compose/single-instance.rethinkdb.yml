# RethinkDB 数据库单机模式覆盖配置文件
# 使用方法：docker-compose -f single-instance.yml -f single-instance.rethinkdb.yml up -d

version: '3.8'

# RethinkDB 环境模板
x-rethinkdb-im-env-vars: &rethinkdb-im-env-vars
  "STORE_USE_ADAPTER": "rethinkdb"

services:
  # 覆盖 db 服务为 RethinkDB 2.4.0
  db:
    image: rethinkdb:2.4.0
    container_name: rethinkdb
    healthcheck:
      test: ["CMD", "curl -f http://localhost:8080/ || exit 1"]

  # 覆盖 im-0 的数据库配置与等待目标
  im-0:
    environment:
      << : *rethinkdb-im-env-vars
      "WAIT_FOR": "rethinkdb:8080"
