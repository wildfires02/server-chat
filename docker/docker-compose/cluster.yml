# 基础 3 节点 IM 集群部署参考配置文件
# 包含组件：
# * MySQL 8.0 数据库
# * 3 个 IM 服务器节点 (im-0, im-1, im-2)
# * 3 个监控指标导出器 (exporter-0, exporter-1, exporter-2)

version: '3.8'

# IM 服务基础模板
x-im:
  &im-base
  depends_on:
    - db
  image: im/im:latest
  platform: linux/amd64
  restart: always

# Exporter 导出器基础模板
x-exporter:
  &exporter-base
  image: im/exporter:latest
  platform: linux/amd64
  restart: always

# IM 环境变量基础模板
x-im-env-vars: &im-env-vars
  # 指定数据库适配器
  "STORE_USE_ADAPTER": "mysql"
  # pprof 路径
  "PPROF_URL": "/pprof"
  # 等待数据库网络连通
  "WAIT_FOR": "mysql:3306"
  
  # --- 推送通知配置 ---
  "TNPG_PUSH_ENABLED": "false"
  "FCM_PUSH_ENABLED": "false"
  "FCM_API_KEY": "AIzaSyD6X4ULR-RUsobvs1zZ2bHdJuPz39q2tbQ"
  "FCM_APP_ID": "1:114126160546:web:aca6ea2981feb81fb44dfb"
  "FCM_PROJECT_ID": "im-1000"
  "FCM_SENDER_ID": 114126160546
  "FCM_VAPID_KEY": "BOgQVPOMzIMXUpsYGpbVkZoEBc0ifKY_f2kSU5DNDGYI6i6CoKqqxDd7w7PJ3FaGRBgVGJffldETumOx831jl58"
  "FCM_MEASUREMENT_ID": "G-WNJDQR34L3"
  
  # --- WebRTC 视频通话配置 ---
  "WEBRTC_ENABLED": "false"

# Exporter 环境变量模板
x-exporter-env-vars: &exporter-env-vars
  "IM_ADDR": "http://im.host:18080/stats/expvar/"
  "SERVE_FOR": "influxdb"
  "INFLUXDB_VERSION": 1.7
  "INFLUXDB_ORGANIZATION": "<你的组织名称>"
  "INFLUXDB_PUSH_INTERVAL": 30
  "INFLUXDB_PUSH_ADDRESS": "https://mon.im.co/intake"
  "INFLUXDB_AUTH_TOKEN": "<认证Token>"

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    security_opt:
      - seccomp=unconfined

  # --- 集群服务器节点 ---
  
  # 节点 0（主负责节点：执行数据库初始化和 Upgrade 工作）
  im-0:
    << : *im-base
    container_name: im-0
    hostname: im-0
    ports:
      - "6060:6060"
    environment:
      << : *im-env-vars
      "CLUSTER_SELF": "im-0"
      "RESET_DB": ${RESET_DB:-false}
      "UPGRADE_DB": ${UPGRADE_DB:-false}

  # 节点 1（等待 im-0 初始化完成后启动，不执行数据库初始化）
  im-1:
    << : *im-base
    container_name: im-1
    hostname: im-1
    ports:
      - "6061:6060"
    environment:
      << : *im-env-vars
      "CLUSTER_SELF": "im-1"
      # 等待 im-0 端口可用，而不是仅等待数据库，保证 im-0 先完成建表/升表
      "WAIT_FOR": "im-0:6060"
      "NO_DB_INIT": "true"

  # 节点 2（同节点 1，等待 im-0 初始化）
  im-2:
    << : *im-base
    container_name: im-2
    hostname: im-2
    ports:
      - "6062:6060"
    environment:
      << : *im-env-vars
      "CLUSTER_SELF": "im-2"
      "WAIT_FOR": "im-0:6060"
      "NO_DB_INIT": "true"

  # --- 监控导出器节点 ---

  exporter-0:
    << : *exporter-base
    container_name: exporter-0
    hostname: exporter-0
    depends_on:
      - im-0
    ports:
      - 6222:6222
    links:
      - im-0:im.host
    environment:
      << : *exporter-env-vars
      "INSTANCE": "im-0"
      "WAIT_FOR": "im-0:6060"

  exporter-1:
    << : *exporter-base
    container_name: exporter-1
    hostname: exporter-1
    depends_on:
      - im-1
    ports:
      - 6223:6222
    links:
      - im-1:im.host
    environment:
      << : *exporter-env-vars
      "INSTANCE": "im-1"
      "WAIT_FOR": "im-1:6060"

  exporter-2:
    << : *exporter-base
    container_name: exporter-2
    hostname: exporter-2
    depends_on:
      - im-2
    ports:
      - 6224:6222
    links:
      - im-2:im.host
    environment:
      << : *exporter-env-vars
      "INSTANCE": "im-2"
      "WAIT_FOR": "im-2:6060"
