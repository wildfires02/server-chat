// JSON 注释较为脆弱，请勿使用过于复杂的形式。
{
	// 监听 WebSocket 和长轮询客户端的 HTTP(S) 地址。可以是 TCP 主机:端口（如 ":6060" 或 "localhost:80"），
	// 或者是 Unix socket 路径如 "unix:/path/to/socket.sock"。
	// TCP 端口可以是数值或标准名称（如 ":80" 或 ":https"），也可包含主机名（如 "localhost:80"）。
	// 若未配置 TLS，默认端口为 ":80"，配置了 TLS 则默认为 ":443"。
	// 可通过命令行参数 --listen 进行重写。
	"listen": ":6060",

	// 挂载流式传输和文件 API 调用的基础 URL 路径。
	// 可通过命令行参数 --api_path 进行重写。
	"api_path": "/",

	// 静态内容的 Cache-Control 响应头缓存时间（单位：秒）。39600 代表 11 小时。
	"cache_control": 39600,

	// 如果设置为 true，则禁用 WebSocket 逐条消息压缩（RFC 7692.4）。
	// 如果使用微软 IIS 作为反向代理，请设置为 true 禁用压缩。
	"ws_compression_disabled": false,

	// 挂载静态资源文件目录的 URL 路径。
	"static_mount": "/",

	// 监听 gRPC 客户端的 TCP 主机:端口或 unix:/path/to/socket。
	// 留空则禁用 gRPC 支持。
	// 可通过命令行参数 --grpc_listen 进行重写。
	"grpc_listen": ":16060",

	// 开启 gRPC keepalive 保活机制处理：https://github.com/grpc/grpc/blob/master/doc/keepalive.md
	// 将服务器的 GRPC_ARG_KEEPALIVE_TIME_MS 设置为 60 秒（默认为 2 小时）。
	"grpc_keepalive_enabled": true,

	// 用于签署 API 密钥的 Salt 盐值。32 字节随机 Base64 编码字符串。可以使用本项目附带的 'keygen' 工具生成 API 密钥与盐值。
	"api_key_salt": "T713/rYYgW7g4m3vG6zGRh7+FM1t0T8j13koXScOAj4=",

	// 允许客户端发送的最大消息体大小（字节，131072 = 128KB）。
	// 超过此大小的媒体文件需通过带外（Out-of-band）方式上传传输。
	// 请勿将此限制设置得过高，否则可能导致以下问题：
	// * Android/iOS 端因 SQLite Cursor 窗口大小限制而失败；
	// * 服务器端使用 MySQL 适配器时因排序缓冲区（sort buffer）限制而失败。
	"max_message_size": 131072,

	// 群组主题（Group Topic）的最大订阅者数量。
	// 这是指在群主题中拥有特定访问权限（发帖、管理员权限等）的成员数量上限。
	// 注意：此设置与 Channel 频道订阅者无关（频道订阅者为不可变只读权限，且无人数限制）。
	"max_subscriber_count": 128,

	// 每个主题或用户允许创建的最大索引标签（Tag）数量。
	"max_tag_count": 16,

	// 若设置为 true，普通用户将无法直接注销/删除其账号。
	"permanent_accounts": false,

	// 暴露运行时统计信息的 URL 路径。若留空或设为 "-" 则禁用。
	// 可通过命令行参数 --expvar 重写。
	"expvar": "/debug/vars",

	// 服务器内部状态调试 URL 路径（用于排查问题）。
	// 请勿将此 URL 用作 Docker 健康检查。若留空或设为 "-" 则禁用。
	// 可通过命令行参数 --server_status 重写。
	// "server_status": "/debug/status",

	// 从 HTTP 头 'X-Forwarded-For' 读取客户端 IP 地址。
	// 当 im 位于反向代理（如 Nginx）之后时非常有用。若未提供则使用默认 RemoteAddr。
	"use_x_forwarded_for": true,

	// 在 HTTP 响应头中添加 X-Frame-Options。可设为 "DENY"、"SAMEORIGIN" 或 "-"（禁用）。未配置则默认为 SAMEORIGIN。
	"x_frame_options": "SAMEORIGIN",

	// 当客户端未明确指定国家且无法推断时分配给 Session 的默认 2 位国家代码（如 "CN"、"US"）。
	// 若为空，服务器默认使用 "US"。
	"default_country_code": "",

	// 是否允许点对点（P2P）单聊主题中为双方硬删除（Hard-Delete）消息。
	// 设置为 false 时，消息仅对发起删除命令的单方隐匿删除。
	// 设置为 true 时，任意一方均可彻底删除该消息。
	// 修改此值仅对新创建的主题生效。
	"p2p_delete_enabled": true,

	// 具备 'D'（删除）权限的用户允许删除消息的最大时效（单位：秒）。
	// 例如 600 表示只能删除 10 分钟以内的消息，超过 10 分钟则不可删除。设为 0 或未配置表示无时间限制。
	// 不影响主题所有者（Owner）：Owner 可以随时删除任何消息。
	"msg_delete_age": 600,

	// 全局唯一命名空间。用于存储用户别名的特殊 Tag 命名空间。别名是指非标准 im 用户 ID 的 Tag。
	"alias_tag": "alias",

	// 大型媒体/文件处理器：消息中附带的大文件/大图片。
	"media": {
		// 使用的媒体处理器名称（目前支持 "fs" 文件系统或 "s3" 存储）。
		"use_handler": "fs",
		// 单个上传文件的最大限制（此处为 8MB 用于测试，生产环境可调整为 100MB 即 104857600）。
		"max_size": 8388608,
		// 垃圾回收（GC）周期（单位：秒）：清理未引用或废弃的上传文件。
		"gc_period": 60,
		// 单次 GC 处理删除的废弃条目数量上限。
		"gc_block_size": 100,
		// 各媒体处理器的具体配置。
		"handlers": {
			// 本地文件系统存储。
			"fs": {
				// 存储上传文件的本地文件系统路径。集群环境下必须确保所有集群节点均可共享访问（如挂载共享网络磁盘）。
				"upload_dir": "uploads",
				// 上传文件的 Cache-Control 响应头。86400 秒 = 24 小时。
				"cache_control": "max-age=86400",
				// 允许下载/上传文件的跨域源 URL 列表（跨域配置，大多数情况下无需配置）。
				// "cors_origins": ["*"]
			},
			// Amazon AWS S3 对象存储配置。
			// 详见：https://pkg.go.dev/github.com/aws/aws-sdk-go/aws#Config
			"s3":{
				// S3 的 Access Key ID 与 Secret Access Key。
				// https://aws.amazon.com/blogs/security/wheres-my-secret-access-key/
				"access_key_id": "your_s3_access_key_id",
				"secret_access_key": "your_s3_secret_access_key",
				// S3 存储桶所在的区域（Region）。
				"region": "s3 region, like us-east-2",
				// S3 存储桶名称。
				"bucket": "your_s3_bucket_name",
				// 设置为 true 可在发送请求时禁用 SSL。默认为 false。
				"disable_ssl": false,
				// 设置为 true 强制使用路径样式寻址（Path-style），即 http://s3.amazonaws.com/BUCKET/KEY。
				// 默认使用虚拟主机域名寻址（http://BUCKET.s3.amazonaws.com/KEY）。
				"force_path_style": false,
				// 自定义 Endpoint URL（例如兼容 S3 协议的 MinIO 服务 "http://minio-api.x.io"）。
				"endpoint": "",
				// 预签名 URL（Presigned URL）的有效期（单位：秒）。
				"presign_ttl": 3600,
				// 上传文件的 Cache-Control 响应头（86400 秒 = 24 小时）。
				"cache_control": "max-age=86400",
				// 允许下载文件的 CORS 跨域源列表。
				"cors_origins": ["*"]
			}
		}
	},

	// TLS (HTTPS) 安全配置。同时适用于 Web 与 gRPC 接口。
	"tls": {
		// 是否启用 TLS。
		"enabled": false,

		// 监听此端口的 HTTP 连接并强制重定向至 HTTPS 端口。不能是 Unix socket。
		"http_redirect": ":80",

		// 响应头中添加 Strict-Transport-Security (HSTS)，数值代表有效期（单位：秒）。0 或负值表示关闭。
		"strict_max_age": 604800,

		// Let's Encrypt 自动证书配置。
		"autocert": {
			// 证书文件缓存目录。
			"cache": "/etc/letsencrypt/live/your.domain.here",

			// 部署联系人邮箱。Let's Encrypt 会在遇到问题时发送通知。
			"email": "noreply@example.com",

			// 绑定的域名列表。
			"domains": ["whatever.example.com"]
		},

		// 若未定义 "autocert"，则从以下路径加载静态证书。若定义了 "autocert" 则忽略此处。
		"cert_file": "/etc/httpd/conf/your.domain.crt",
		"key_file": "/etc/httpd/conf/your.domain.key"
	},

	// 身份认证配置。
	"auth_config": {
		// 外部显示认证器名称与内部名称的转换映射。
		// 例如使用 ["my-auth:basic", "basic:"] 将 "basic" 重命名为 "my-auth"，并禁止直接用 "basic" 访问。
		// 如果要使用 REST 认证，则配置为 ["basic:rest", "rest:"]。
		// 默认保持映射关系不变。
		"logical_names": [],

		// 基础认证方式（账号 + 密码）。
		"basic": {
			// 将 'auth-name:username' 自动添加到用户的 Tag 中，使用户可以通过用户名被搜索到。
			"add_to_tags": true,
			// 登录账号的最小 Rune 字符长度（例如 "登录" 长度为 2，而不是 6 字节）。最大长度固定为 32。
			"min_login_length": 4,
			// 密码的最小字符长度（例如 "пароль" 长度为 6，而不是 12 字节）。
			// 密码没有最大长度限制，但 MySQL 和 PgSQL 适配器限制为 32 字节。
			"min_password_length": 6
		},

		// Token (令牌) 认证配置。
		"token": {
			// 安全 Token 的有效期限（单位：秒）。1209600 秒 = 2 周。
			"expire_in": 1209600,

			// Token 序列号。改变此数值可使之前发出的所有 Token 立即失效。
			"serial_num": 1,

			// 用于签署 Token 的密钥（HMAC 密钥）。请随机生成并妥善保管。
			// 任何 32 字节随机 Base64 编码字符串。
			//
			// === 重要提示 ===
			//
			// 生产环境中必须修改此密钥！否则任何人都可以免密伪造 Token 登录服务器！
			// 例如在 Linux/Mac 上生成：
			//    echo $(head -c 32 /dev/urandom | base64 | tr -d '\n')
			// Windows 上生成：
			//    powershell -command "[Convert]::ToBase64String((1..32|%{[byte](Get-Random -Max 256)}))"
			"key": "wfaY2RgF2S1OQI/ZlK+LSrp1KB2jwAdGAIHQ7JZn+Kc="
		},

		// 验证码认证配置（用于重置密码等短验证码场景）。
		"code": {
			// 验证码有效期限（单位：秒）。900 秒 = 15 分钟。
			"expire_in": 900,

			// 允许输入验证码的最大重试次数。
			"max_retries": 3,

			// 验证码长度。
			"code_length": 6
		}
	},

	// 数据库持久化配置。
	"store_config": {
		// 用于加密用户 ID 和主题（Topic）名称的 XTEA 加密密钥（16 字节随机 Base64 字符串）。
		// 必须自行生成并隐蔽保管，否则用户 ID 将可预测，容易引发垃圾信息攻击。
		"uid_key": "la6YsO+bNX/+XIkOqc5Svw==",

		// 单次数据库查询返回的最大结果条数。
		"max_results": 1024,

		// 当前使用的数据库适配器名称，必须属于下文 adapters 中的某一项（例如 "mysql"、"postgres"）。
		"use_adapter": "mysql",

		// 各数据库适配器的具体配置。
		"adapters": {
			// PostgreSQL 数据库配置。详见 https://godoc.org/github.com/jackc/pgx#Config
			"postgres": {
				// PostgreSQL 连接设置。修改用户名之前请先查阅官方 FAQ！
				"User": "postgres",
				"Passwd": "postgres",
				"Host": "localhost",
				"Port": "5432",
				"DBName": "im",
				"SSLMode": "disable",

				// DSN：数据库连接字符串模式。
				// "dsn": "postgresql://postgres:postgres@localhost:5432/im?sslmode=disable&connect_timeout=10",

				// PostgreSQL 连接池配置。
				// 允许的最大打开连接数。0 表示无限制。
				"max_open_conns": 50,
				// 空闲连接池中的最大连接数。0 表示不保留空闲连接。
				"max_idle_conns": 50,
				// 连接可被重用的最大生存时间（单位：秒）。0 表示无限制。
				"conn_max_lifetime": 60,
				// 等待连接池连接的超时时间（单位：秒）。0 表示无超时。
				"sql_timeout": 10
			},

			// MySQL 数据库配置
			"mysql": {
				// MySQL 连接设置。
				"User": "root",
				"Passwd": "123456",
				"Net": "tcp",
				"Addr": "localhost",
				"DBName": "im",
				// Collation 排序规则。MySQL 8.0+ 默认为 utf8mb4_0900_ai_ci，推荐在早期版本中配置以完整支持 Emoji 和 CJK 字符。
				"Collation": "utf8mb4_0900_ai_ci",
				// 将时间解析为 time.Time 格式（必填为 true）。
				"ParseTime": true,

				// DSN：数据库连接字符串模式。
				// "dsn": "root@tcp(localhost)/im?parseTime=true&collation=utf8mb4_0900_ai_ci",

				// MySQL 连接池配置。
				// 最大打开连接数。默认 0（无限制）。
				"max_open_conns": 64,
				// 空闲连接池中的最大连接数。<= 0 表示不保留空闲连接。
				"max_idle_conns": 64,
				// 连接的最大生存时间（单位：秒）。
				"conn_max_lifetime": 60,

				// 数据库请求超时时间（单位：秒）。<= 0 则无超时限制。
				"sql_timeout": 10
			},

			// RethinkDB 数据库配置。详见 https://godoc.org/github.com/rethinkdb/rethinkdb-go#ConnectOpts
			"rethinkdb": {
				// RethinkDB 节点地址（字符串或数组）。
				"addresses": "localhost:28015",
				// 主数据库名称。
				"database": "im"
			},

			// MongoDB 数据库配置。
			"mongodb": {
				// Connection string 连接字符串：https://www.mongodb.com/docs/manual/reference/connection-string/
				// 如果使用 MongoDB Atlas，则必须配置 uri。
				// 例如："uri": "mongodb+srv://CREDENTIALS@PROJECT.gmuaq.mongodb.net/DATABASE?retryWrites=true&w=majority",
				"uri": "",
				// 支持的 Server API 版本（通常为 "1"）。
				"api_version": "",

				// MongoDB 节点地址（字符串或数组）。
				"addresses": "localhost:27017",
				// 主数据库名称。
				"database": "im",
				// 副本集（Replica Set）名称。单机环境请删除此行。若禁用副本集，事务功能也将被禁用。
				"replica_set": "rs0"

				// 身份验证配置选项（若 MongoDB 启用了 Auth 请取消注释配置）：
				// "auth_mechanism": "SCRAM-SHA-256",
				// "auth_source": "admin",
				// "username": "im",
				// "password": "im",

				// TLS 安全配置（取消注释启用）：
				// "tls": true,
				// "tls_cert_file": "/path/to/cert_file",
				// "tls_private_key": "/path/to/private_key",
				// "tls_skip_verify": false
			}
		}
	},

	// 账号验证器配置（邮箱验证、短信验证、验证码）。
	"acc_validation": {

		// 邮箱验证器配置。
		"email": {
			// 将邮箱自动绑定为 Tag，使用户可以通过邮箱搜索，并禁用手动创建 email: 标签。
			"add_to_tags": true,

			// 需要进行此验证方法的鉴权级别列表。移除此行可禁用邮箱验证。
			"required": ["auth"],

			// 传递给验证器的配置信息。
			"config": {
				// 运行 im 服务器的主机 URL。用于邮件中的链接。
				"host_url": "http://localhost:6060/",

				// SMTP 服务器地址。
				"smtp_server": "smtp.example.com",

				// SMTP 端口。"25" 适用于普通邮件 RFC 5321 (2821, 821)，"587" 适用于 TLS RFC 3207。
				"smtp_port": "25",

				// 发件人显示名称和邮箱地址（RFC 5322 标准）。
				"sender": "\"im\" <noreply@example.com>",

				// 用于 SMTP 认证的账号；若未填写，则不进行连接认证。
				"login": "john.doe@example.com",

				// 发件人认证密码；仅在配置了 "login" 时生效。
				"sender_password": "your-password-here",

				// 认证机制，可选。"login"、"cram-md5"、"plain"（默认）。
				"auth_mechanism": "login",

				// SMTP HELO/EHLO 命令使用的 FQDN；若未指定，默认使用 host_url 的主机名。
				"smtp_helo_host": "example.com",

				// 是否跳过服务器证书链和主机名验证。开启时易受中间人攻击。
				"insecure_skip_verify": false,

				// 尝试加载的语言列表。首个语言为默认语言。
				"languages": ["en", "es", "fr", "pt", "ru", "uk", "vi", "zh", "zh-TW"],

				// 允许的确认尝试次数，超出后锁定该凭证。
				"max_retries": 3,

				// 允许注册的邮箱域名白名单。为空表示允许任何邮箱域名注册。
				"domains": [],

				// 调试/测试用的固定响应验证码。
				// === 重要：生产环境必须移除！ ===
				"debug_response": "123456"
			}
		},

		// 短信和语音验证码占位验证器。默认禁用。生产环境建议接入 Twilio 或第三方短信服务。
		"tel": {
			"add_to_tags": true,
			"config": {
				// 短信中使用的服务器 URL 地址。
				"host_url": "http://localhost:6060/",

				// 语言列表。
				"languages": ["en", "es", "fr", "pt", "ru", "uk", "vi", "zh", "zh-TW"],

				// 短信发件人显示名称。
				"sender": "im",

				// 允许尝试的最大重试次数。
				"max_retries": 3,

				// Twilio 配置选项（可选）。
				//"twilio_conf": {
				//	"account_sid": "ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
				//	"auth_token": "f2xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
				//},

				// 调试/测试用的固定响应验证码。
				// === 重要：生产环境必须移除！ ===
				"debug_response": "123456"
			}
		}
	},

	// 过期未激活账号垃圾回收配置：清理至少在 'gc_min_account_age' 小时前更新且未验证的账号。
	"acc_gc_config": {
		"enabled": true,
		// GC 运行周期（单位：秒）。
		"gc_period": 3600,
		// 单次清理的账号数量上限。
		"gc_block_size": 10,
		// 账号自上次修改以来的最小小时数。
		"gc_min_account_age": 30
	},

	// 推送通知配置。
	"push": [
		{
			// 标准输出 (STDOUT) 推送器，用于调试。
			"name":"stdout",
			"config": {
				"enabled": false
			}
		},
		{
			// Google FCM (Firebase Cloud Messaging) 推送器。
			"name":"fcm",
			"config": {
				// 默认禁用。未配置服务器密钥前无法运行。
				"enabled": false,

				// Firebase 项目 ID。
				"project_id": "your-project-id",

				// 服务账号凭证 JSON 配置。
				"credentials": {
					"type": "service_account",
						"project_id": "your-project-id",
						"private_key_id": "some-random-looking-hex-number",
						"private_key": "-----BEGIN PRIVATE KEY-----\nbase64-encoded bits of your private key\n-----END PRIVATE KEY-----\n",
						"client_email": "firebase-adminsdk-abc123@your-project-id.iam.gserviceaccount.com",
						"client_id": "1234567890123456789",
						"auth_uri": "https://accounts.google.com/o/oauth2/auth",
						"token_uri": "https://oauth2.googleapis.com/token",
						"auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
						"client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-abc123%40your-project-id.iam.gserviceaccount.com"
				},

				// 服务账号凭证 JSON 文件路径（与上面内嵌凭证二选一）。
				"credentials_file": "/path/to/service-account-file-with-credentials.json",

				// 推送未送达时的废弃超时时间 TTL（单位：秒）。
				"time_to_live": 3600,

				// Android 推送特定配置。开启后将优先于 data payload 效果。
				"android": {
					// 设置为 false 则发送仅含数据的 Data-only 消息。
					"enabled": false,

					// Android 通知图标资源 ID。
					"icon": "ic_logo_push",

					// 通知图标颜色。
					"color": "#3949AB",

					// 捕获此通知的 Intent filter 名称。
					"click_action": ".MessageActivity",

					// 新消息通知配置。
					"msg": {
						// 静态标题字符串（不推荐，无法国际化）。
						"title": "",

						// 静态消息体字符串（不推荐）。
						"body": "",

						// Android 本地化字符串资源 ID 作为标题（推荐，优先于 title）。
						"title_loc_key": "new_message",

						// Android 本地化字符串资源 ID 作为消息体（优先于 body）。
						"body_loc_key": ""
					},

					// 新订阅/新会话通知配置。
					"sub": {
						"title_loc_key": "new_chat",
						"body_loc_key": ""
					}
				}
			}
		},
		{
			// im 官方推送网关（TNPG），详见 https://github.com/im/chat/tree/master/server/push/tnpg
			"name":"tnpg",
			"config": {
				"enabled": false,
				// console.im.co 上的组织短名称。
				"org": "test",
				// console.im.co 上获取的认证 Token。
				"token": "jwt-security-token-obtained-from-console.im.co"
			}
		}
	],

	// 音视频通话 (WebRTC) 配置。
	"webrtc": {
		// 默认禁用。没有有效配置的 ice_servers 将无法工作。
		"enabled": false,
		// 音视频呼叫超时未接听自动挂断时间（单位：秒）。
		"call_establishment_timeout": 30,
		// WebRTC 的 ICE (STUN / TURN) 服务器配置。
		// 当通话双方均在 NAT 之后且未配置 TURN 服务器时，音视频通话将无法建立。
		"ice_servers": [
			{
				"urls": [
					"stun:stun.example.com"
				]
			},
			{
				"username": "user-name-to-use-for-authentication-with-the-server",
				"credential": "your-password",
				"urls": [
					"turn:turn.example.com:80?transport=udp",
					"turn:turn.example.com:3478?transport=udp",
					"turn:turn.example.com:80?transport=tcp",
					"turn:turn.example.com:3478?transport=tcp",
					"turns:turn.example.com:443?transport=tcp",
					"turns:turn.example.com:5349?transport=tcp"
				]
			}
		],
		// 独立配置文件形式引入 ICE 服务器配置。
		"ice_servers_file": "/path/to/ice-servers-config.json"
	},

	// 集群模式 (Cluster) 配置。
	"cluster_config": {
		// 当前节点的名称。也可通过命令行 --cluster_self 指定。留空表示关闭集群功能。
		"self": "",

		// 可用节点列表。
		"nodes": [
			// 集群中每个节点的名称和 TCP 地址。端口 12001..12003 为内部通信端口，无需对外开放。
			{"name": "one", "addr":"localhost:12001"},
			{"name": "two", "addr":"localhost:12002"},
			{"name": "three", "addr":"localhost:12003"}
		],

		// 故障转移 (Failover) 配置。
		"failover": {
			// 是否启用故障转移。
			"enabled": true,
			// 心跳间隔时间（单位：毫秒）。
			"heartbeat": 100,
			// 当 Leader 丢失心跳达此次数后发起新 Leader 选举。
			"vote_after": 8,
			// 当节点丢失心跳达此次数后被标记为宕机。
			"node_fail_after": 16
		}
	},

	// 插件 (Plugins) 配置。
	"plugins": [
		{
			// 是否启用此插件。
			"enabled": false,

			// 插件名称，必须唯一。
			"name": "python_chat_bot",

			// 超时时间（单位：微秒）。
			"timeout": 20000,

			// 发送到插件的事件过滤器。
			"filters": {
				// 账号创建事件。
				"account": "C"
			},

			// 插件执行失败时的错误码（0 表示忽略错误）。
			"failure_code": 0,

			// 插件执行失败时返回的错误提示文本。
			"failure_text": null,

			// 插件服务 gRPC 地址。
			"service_addr": "tcp://localhost:40051"
		}
	]
}
