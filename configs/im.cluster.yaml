# server-chat 三节点生产集群模板。
# 每个节点都使用一份完整 YAML；不读取环境变量覆盖。
# 部署系统必须用 Secret 填充所有空值，再挂载为 /etc/im/im.yaml。

runtime:
  environment: production
  deployment_mode: cluster

# 客户端通过负载均衡器连接此端口。
listen: ":6060"
client_origins:
  - https://chat.example.com
use_x_forwarded_for: true
x_frame_options: DENY
default_country_code: CN

# 健康检查路径使用代码默认值：/livez、/readyz、/drainz 和 /clusterz。
health:
  drain_timeout: 30s

# 必须为生产环境生成独立密钥；上线后不可修改。
api_key_salt: ""
max_message_size: 4194304
max_subscriber_count: 10000
max_tag_count: 32
p2p_delete_enabled: true

# 聊天主库最多保留 90 天；到期媒体解除引用后由对象存储垃圾回收删除。
message_retention:
  enabled: true
  days: 90
  scan_period: 300
  batch_size: 5000
alias_tag: alias

# 商城是客户归属、私聊和通话权限的事实源。
business_policy:
  enabled: true
  endpoint: http://server-user.internal:9889/v1/internal/im/policy/evaluate
  bearer_token: ""
  audit_endpoint: http://server-user.internal:9889/v1/internal/im/audit/events

# 集群必须使用共享对象存储，不能使用节点本地 fs。
media:
  use_handler: s3
  max_size: 33554432
  gc_period: 60
  gc_block_size: 100
  handlers:
    s3:
      access_key_id: ""
      secret_access_key: ""
      region: auto
      bucket: ""
      endpoint: ""
      direct_upload: true
      presign_ttl: 3600
      # R2 Custom Domain 是公开配置；密钥仍由 Secret 注入。
      cdn_base_url: "https://matesave.com"
      cache_control: max-age=86400
      # 替换为真实的 Web HTTPS 域名，否则浏览器直传会被 CORS 拒绝。
      cors_origins:
        - https://chat.example.com

auth_config:
  basic:
    add_to_tags: true
    min_login_length: 3
    min_password_length: 10
  token:
    expire_in: 1209600
    serial_num: 1
    key: ""

# 生产集群默认使用 PostgreSQL。MySQL 和 MongoDB 配置见各自部署模板。
store_config:
  uid_key: ""
  use_adapter: postgres
  adapters:
    postgres:
      dsn: ""
      ssl_mode: verify-full
      max_open_conns: 200
      max_idle_conns: 50
      conn_max_lifetime: 300
      sql_timeout: 10

acc_gc_config:
  enabled: true
  gc_period: 3600
  gc_block_size: 100
  gc_min_account_age: 30

# Firebase Admin 凭据以 Secret 文件挂载，不再使用 push 列表。
firebase:
  enabled: true
  credential_file: "/etc/im/firebase-adminsdk.json"
  time_to_live: 3600

# 一对一和群组语音/视频全部使用 Agora，不配置 STUN/TURN。
calls:
  enabled: true
  # 由 Secret 填入 Agora Console 中的 32 位 App ID 和 App Certificate。
  app_id: ""
  app_certificate: ""

cluster_config:
  cluster_id: im-production
  expected_replicas: 3
  initial_members:
    - im-0
    - im-1
    - im-2

  # 每个节点的最终 YAML 必须填写自己的 self 和与 nodes 一致的地址。
  self: ""
  advertise_addr: ""
  nodes:
    - name: im-0
      addr: im-0.im.internal:12000
    - name: im-1
      addr: im-1.im.internal:12000
    - name: im-2
      addr: im-2.im.internal:12000

  # etcd 负责节点租约和集群拓扑。
  control_plane:
    provider: etcd
    endpoints:
      - https://etcd-0.etcd.internal:2379
      - https://etcd-1.etcd.internal:2379
      - https://etcd-2.etcd.internal:2379
    namespace: /im/production
    tls:
      ca_file: /etc/im/tls/etcd/ca.pem
      cert_file: /etc/im/tls/etcd/client.pem
      key_file: /etc/im/tls/etcd/client-key.pem
      server_name: etcd

  # 只显式填写节点监听地址，队列、Lane、重试和去重窗口使用代码默认值。
  transport:
    listen: 0.0.0.0:12000

  # 节点间强制双向 TLS，每个节点的证书和私钥路径不同。
  tls:
    ca_file: /etc/im/tls/cluster/ca.pem
    cert_file: ""
    key_file: ""
