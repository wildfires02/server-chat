# IM 服务端开发环境配置。
#
# 生产环境不要直接使用示例密钥、密码和调试验证码。
# im-server 使用 Viper 只读取本文件，不接受命令行或环境变量覆盖。

# 运行环境与部署模式必须显式声明；此文件用于开发单机模式。
log_flags: stdFlags

runtime:
  environment: development
  deployment_mode: standalone

# 网络与协议。
listen: ":6060"
api_path: /
cache_control: 39600
ws_compression_disabled: false
static_mount: /
static_data: "-"
grpc_listen: ":16060"
grpc_keepalive_enabled: true
expvar: /debug/vars
server_status: "-"
pprof: ""
pprof_url: ""
# 健康探针与本机优雅摘流接口。
health:
  live_path: /livez
  ready_path: /readyz
  drain_path: /drainz
  topology_path: /clusterz
  drain_timeout: 15s
use_x_forwarded_for: true
x_frame_options: SAMEORIGIN
default_country_code: ""

# API Key 签名盐值；生产部署必须在生成的 YAML 中替换。
api_key_salt: T713/rYYgW7g4m3vG6zGRh7+FM1t0T8j13koXScOAj4=

# 消息、群组和账号限制。
max_message_size: 131072
max_subscriber_count: 128
max_tag_count: 16
permanent_accounts: false
p2p_delete_enabled: true
# 0 表示撤回消息不限制时间。
msg_delete_age: 0
alias_tag: alias

# im-server 只读取独立 im-admin 写入的翻译策略，不暴露管理 API。
translation:
  enabled: true
  refresh_interval: 5

# 文件与对象存储。
media:
  use_handler: fs
  max_size: 8388608
  gc_period: 60
  gc_block_size: 100
  processing:
    enabled: false
    workers: 2
    queue_size: 256
    timeout: 120
    poll_interval: 2
    max_attempts: 5
    retry_base: 5
    lease_seconds: 180
    clamav_addr: "127.0.0.1:3310"
    ffmpeg: /usr/bin/ffmpeg
    libreoffice: /usr/bin/libreoffice
  handlers:
    fs:
      upload_dir: uploads
      cache_control: max-age=86400
      # cors_origins: ["*"]
    s3:
      access_key_id: your_s3_access_key_id
      secret_access_key: your_s3_secret_access_key
      region: s3 region, like us-east-2
      bucket: your_s3_bucket_name
      disable_ssl: false
      force_path_style: false
      endpoint: ""
      presign_ttl: 3600
      cache_control: max-age=86400
      cors_origins:
        - "*"

# HTTP 与 gRPC 共用的 TLS 配置。
tls:
  enabled: false
  http_redirect: ":80"
  strict_max_age: 604800
  autocert:
    cache: /etc/letsencrypt/live/your.domain.here
    email: noreply@example.com
    domains:
      - whatever.example.com
  cert_file: /etc/httpd/conf/your.domain.crt
  key_file: /etc/httpd/conf/your.domain.key

# 登录与令牌认证。
auth_config:
  logical_names: []
  basic:
    add_to_tags: true
    min_login_length: 4
    min_password_length: 6
  token:
    expire_in: 1209600
    serial_num: 1
    # 生产环境必须在生成的 YAML 中写入独立随机值。
    key: wfaY2RgF2S1OQI/ZlK+LSrp1KB2jwAdGAIHQ7JZn+Kc=
  code:
    expire_in: 900
    max_retries: 3
    code_length: 6

# 数据库存储。use_adapter 必须与构建标签和 adapters 中的名称一致。
# 源码开发启动命令：go run -tags mysql cmd/im-server/main.go
store_config:
  # 生产环境必须在生成的 YAML 中写入独立随机值。
  uid_key: la6YsO+bNX/+XIkOqc5Svw==
  max_results: 1024
  use_adapter: mysql
  adapters:
    postgres:
      user: postgres
      passwd: postgres
      host: localhost
      port: "5432"
      dbname: im
      ssl_mode: disable
      # 也可以仅提供 dsn。
      # dsn: postgresql://postgres:postgres@localhost:5432/im?sslmode=disable
      max_open_conns: 50
      max_idle_conns: 50
      conn_max_lifetime: 60
      sql_timeout: 10
    mysql:
      user: root
      passwd: "123456"
      net: tcp
      addr: 127.0.0.1:3306
      dbname: im
      collation: utf8mb4_bin
      parseTime: true
      # 也可以仅提供 dsn。
      # dsn: root@tcp(127.0.0.1:3306)/im?parseTime=true&collation=utf8mb4_bin
      max_open_conns: 64
      max_idle_conns: 64
      conn_max_lifetime: 60
      sql_timeout: 10
    rethinkdb:
      addresses: localhost:28015
      database: im
    mongodb:
      uri: ""
      api_version: ""
      addresses: localhost:27017
      database: im
      replica_set: rs0
      # auth_mechanism: SCRAM-SHA-256
      # auth_source: admin
      # username: im
      # password: im
      # tls: true
      # tls_cert_file: /path/to/cert-file
      # tls_private_key: /path/to/private-key
      # tls_skip_verify: false

# 邮箱和手机号验证。
acc_validation:
  email:
    add_to_tags: true
    # 默认开发配置未提供真实 SMTP 与邮件模板，因此不强制邮箱验证。
    # 接入模板后可改为 required: [auth]。
    required: []
    config:
      host_url: http://localhost:6060/
      smtp_server: smtp.example.com
      smtp_port: "25"
      sender: '"im" <noreply@example.com>'
      login: john.doe@example.com
      sender_password: your-password-here
      auth_mechanism: login
      smtp_helo_host: example.com
      insecure_skip_verify: false
      languages:
        - en
        - es
        - fr
        - pt
        - ru
        - uk
        - vi
        - zh
        - zh-TW
      max_retries: 3
      domains: []
      # 仅限开发环境；生产环境必须删除。
      debug_response: "123456"
  tel:
    add_to_tags: true
    config:
      host_url: http://localhost:6060/
      languages:
        - en
        - es
        - fr
        - pt
        - ru
        - uk
        - vi
        - zh
        - zh-TW
      sender: im
      max_retries: 3
      # 仅限开发环境；生产环境必须删除。
      debug_response: "123456"

# 未激活账号垃圾回收。
acc_gc_config:
  enabled: true
  gc_period: 3600
  gc_block_size: 10
  gc_min_account_age: 30

# 推送通知。
push:
  - name: stdout
    config:
      enabled: false
  - name: fcm
    config:
      enabled: false
      project_id: your-project-id
      # Firebase 服务账号也可通过 credentials_file 指向官方 JSON 凭据。
      credentials:
        type: service_account
        project_id: your-project-id
        private_key_id: some-random-looking-hex-number
        private_key: |
          -----BEGIN PRIVATE KEY-----
          base64-encoded bits of your private key
          -----END PRIVATE KEY-----
        client_email: firebase-adminsdk-abc123@your-project-id.iam.gserviceaccount.com
        client_id: "1234567890123456789"
        auth_uri: https://accounts.google.com/o/oauth2/auth
        token_uri: https://oauth2.googleapis.com/token
        auth_provider_x509_cert_url: https://www.googleapis.com/oauth2/v1/certs
        client_x509_cert_url: https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-abc123%40your-project-id.iam.gserviceaccount.com
      credentials_file: /path/to/service-account-file-with-credentials.json
      time_to_live: 3600
      android:
        enabled: false
        icon: ic_logo_push
        color: "#3949AB"
        click_action: .MessageActivity
        msg:
          title: ""
          body: ""
          title_loc_key: new_message
          body_loc_key: ""
        sub:
          title_loc_key: new_chat
          body_loc_key: ""
  - name: tnpg
    config:
      enabled: false
      org: test
      token: jwt-security-token-obtained-from-console.im.co

# 点对点 WebRTC 与 Agora 群组通话。
webrtc:
  enabled: true
  call_establishment_timeout: 30
  ice_servers:
    - urls:
        - stun:stun.example.com
    - username: user-name-to-use-for-authentication-with-the-server
      credential: your-password
      urls:
        - turn:turn.example.com:80?transport=udp
        - turn:turn.example.com:3478?transport=udp
        - turn:turn.example.com:80?transport=tcp
        - turn:turn.example.com:3478?transport=tcp
        - turns:turn.example.com:443?transport=tcp
        - turns:turn.example.com:5349?transport=tcp
  # 内嵌 ice_servers 为空时，可引用以 ice_servers 为根键的独立 YAML 文件。
  ice_servers_file: ""
  agora:
    enabled: true
    # 推荐通过 AGORA_APP_ID 和 AGORA_APP_CERTIFICATE 注入。
    app_id: "b547e4eff8274ca5ab14b4015f3b0105"
    app_certificate: "74e69faed5d143df9ad4850e1fd542a0"
    token_ttl: 3600
    channel_prefix: im
    max_participants: 128

# gRPC 插件。
plugins:
  - enabled: false
    name: python_chat_bot
    timeout: 20000
    filters:
      account: C
    failure_code: 0
    failure_text: null
    service_addr: tcp://localhost:40051
