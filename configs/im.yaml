# server-chat 本地开发配置。只保留当前启用功能和必要参数。
# 生产环境使用 /etc/im/im.yaml，并通过 Secret 管理其中的密钥。
runtime:
  # development / staging / production
  environment: development
  # 本机使用 standalone，多节点使用 cluster。
  deployment_mode: standalone

# 客户端 HTTP、WebSocket 和 Long Poll 端口。
listen: ":6060"
# web-chat 跨域调用 HTTP 工作区接口时使用；同源部署可留空。
client_origins:
  - http://localhost:3000
# 位于可信反向代理后时启用。
use_x_forwarded_for: true

# API Key 签名盐值；生产部署必须在生成的 YAML 中替换。
api_key_salt: T713/rYYgW7g4m3vG6zGRh7+FM1t0T8j13koXScOAj4=

# 消息 128 KiB、普通群 128 人。
max_message_size: 131072
max_subscriber_count: 128
# 是否允许删除点对点会话中的消息。
p2p_delete_enabled: true
# 用户和 Topic 别名使用的标签命名空间。
alias_tag: alias

# im-server 只读取独立 im-admin 写入的翻译策略，不暴露管理 API。
translation:
  enabled: true
  refresh_interval: 5

# 本地联调使用与 Groupbuying server 相同的服务间密钥。
business_policy:
  enabled: true
  endpoint: http://127.0.0.1:9889/v1/internal/im/policy/evaluate
  # 必须与 Groupbuying server 的服务间令牌一致。
  bearer_token: dev-only-change-this-admin-token
  audit_endpoint: http://127.0.0.1:9889/v1/internal/im/audit/events

# 文件存储：当前使用 Cloudflare R2。
media:
  use_handler: s3
  # 单文件默认上限 8 MiB。
  max_size: 8388608
  # 每 60 秒最多清理 100 条失效文件记录。
  gc_period: 60
  gc_block_size: 100
  handlers:
    s3:
      # R2 S3 API 凭据；由 sync-r2-config 从商城数据库同步。
      access_key_id: "37af66e492edbf7bc7d5c1e2bc02229f"
      secret_access_key: "90e03d46b9cc8513ef3cc18f52eb1e012e605687fe53896b4d139d09e7f1b97d"
      region: auto
      bucket: "prod"
      # S3 API 地址，不是公开图片域名。
      endpoint: "https://03e94ef5ea50cc774ac54c4ab911db8a.r2.cloudflarestorage.com"
      # 预签名地址有效期一小时；浏览器直接上传 R2。
      presign_ttl: 3600
      direct_upload: true
      # 有 R2 自定义域名时填写；为空时使用预签名下载。
      cdn_base_url: "https://matesave.com"
      cache_control: max-age=86400
      # 开发环境允许所有来源；生产环境改为实际 HTTPS 域名。
      cors_origins:
        - "*"

# 登录与令牌认证。
auth_config:
  basic:
    add_to_tags: true
    min_login_length: 4
    min_password_length: 6
  token:
    # 有效期 14 天；serial_num 递增会让旧令牌失效。
    expire_in: 1209600
    serial_num: 1
    # 上线后不要修改或提交。
    key: wfaY2RgF2S1OQI/ZlK+LSrp1KB2jwAdGAIHQ7JZn+Kc=

# 数据库：当前使用 MySQL；保留 PostgreSQL 和 MongoDB 便于以后切换。
store_config:
  # 上线后不要修改 uid_key，否则既有对象 ID 无法正确解析。
  uid_key: la6YsO+bNX/+XIkOqc5Svw==
  use_adapter: mysql
  adapters:
    mysql:
      user: root
      passwd: "123456"
      net: tcp
      addr: 127.0.0.1:3306
      dbname: im
      collation: utf8mb4_bin
      parseTime: true
      max_open_conns: 64
      max_idle_conns: 64
      conn_max_lifetime: 60
      sql_timeout: 10
    postgres:
      user: postgres
      passwd: postgres
      host: localhost
      port: "5432"
      dbname: im
      ssl_mode: disable
      max_open_conns: 50
      max_idle_conns: 50
      conn_max_lifetime: 60
      sql_timeout: 10
    mongodb:
      uri: ""
      addresses: localhost:27017
      database: im
      replica_set: rs0

# 未激活账号垃圾回收。
acc_gc_config:
  enabled: true
  gc_period: 3600
  gc_block_size: 10
  gc_min_account_age: 30

# Firebase Cloud Messaging；enabled=false 时不会读取凭据文件或发送通知。
firebase:
  enabled: true
  credential_file: "./firebase-adminsdk.json" # 请放置服务账号 JSON 文件路径
  # 离线消息最多保留一小时。
  time_to_live: 3600

# 所有一对一和群组语音/视频都使用 Agora。
calls:
  enabled: true
  app_id: "b547e4eff8274ca5ab14b4015f3b0105"
  app_certificate: "74e69faed5d143df9ad4850e1fd542a0"
