# 独立 im-admin 开发配置。它必须与 im-server 连接同一个数据库。

runtime:
  environment: development
  deployment_mode: standalone

listen: ":6061"

# 必须与聊天服务使用相同的 API Key 盐值，供身份会话接口签发客户端凭证。
api_key_salt: T713/rYYgW7g4m3vG6zGRh7+FM1t0T8j13koXScOAj4=

# Token 密钥和序列号必须与 im-server 一致。身份接口会为每次请求签发
# 有效期更短的令牌，默认有效期为 15 分钟。
auth_config:
  token:
    expire_in: 900
    serial_num: 1
    key: wfaY2RgF2S1OQI/ZlK+LSrp1KB2jwAdGAIHQ7JZn+Kc=

admin:
  enabled: true
  # Snowflake worker ID 不得与任何 im-server 节点重复。
  worker_id: 1023
  bootstrap_token: dev-only-change-this-admin-token
  allowed_origins:
    - http://localhost:4173

store_config:
  # 源码开发启动命令：go run -tags mysql cmd/im-admin/main.go
  uid_key: la6YsO+bNX/+XIkOqc5Svw==
  use_adapter: mysql
  adapters:
    mysql:
      user: root
      passwd: "123456"
      net: tcp
      addr: 127.0.0.1:3306
      dbname: im
      collation: utf8mb4_0900_ai_ci
      parseTime: true
      max_open_conns: 16
      max_idle_conns: 8
      conn_max_lifetime: 60
      sql_timeout: 10
    postgres:
      user: postgres
      passwd: postgres
      host: localhost
      port: "5432"
      dbname: im
      ssl_mode: disable
      max_open_conns: 16
      max_idle_conns: 8
      conn_max_lifetime: 60
      sql_timeout: 10
    mongodb:
      uri: ""
      addresses: localhost:27017
      database: im
      replica_set: rs0
