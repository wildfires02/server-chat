# server-chat 本机三节点开发集群配置。
# scripts/run-cluster.sh 会为每个进程生成 self、advertise_addr 和监听端口。

runtime:
  environment: development
  deployment_mode: cluster

listen: ":6060"
client_origins:
  - http://localhost:3000
expvar: /debug/vars
default_country_code: CN
health:
  drain_timeout: 15s

# 仅限本地开发，不得用于生产环境。
api_key_salt: T713/rYYgW7g4m3vG6zGRh7+FM1t0T8j13koXScOAj4=
max_message_size: 4194304
max_subscriber_count: 1000
max_tag_count: 32
p2p_delete_enabled: true
alias_tag: alias

# 本地集群与单机配置使用同一个 Cloudflare R2 桶，避免节点本地文件不一致。
media:
  use_handler: s3
  max_size: 33554432
  gc_period: 60
  gc_block_size: 100
  handlers:
    s3:
      access_key_id: "37af66e492edbf7bc7d5c1e2bc02229f"
      secret_access_key: "90e03d46b9cc8513ef3cc18f52eb1e012e605687fe53896b4d139d09e7f1b97d"
      region: auto
      bucket: "prod"
      endpoint: "https://03e94ef5ea50cc774ac54c4ab911db8a.r2.cloudflarestorage.com"
      presign_ttl: 3600
      direct_upload: true
      cdn_base_url: "https://matesave.com"
      cache_control: max-age=86400
      cors_origins:
        - "*"

auth_config:
  basic:
    add_to_tags: true
    min_login_length: 3
    min_password_length: 6
  token:
    expire_in: 1209600
    serial_num: 1
    key: wfaY2RgF2S1OQI/ZlK+LSrp1KB2jwAdGAIHQ7JZn+Kc=

store_config:
  uid_key: la6YsO+bNX/+XIkOqc5Svw==
  use_adapter: mysql
  adapters:
    mysql:
      dsn: root:123456@tcp(127.0.0.1:3306)/im?parseTime=true&collation=utf8mb4_0900_ai_ci
      max_open_conns: 64
      max_idle_conns: 32
      conn_max_lifetime: 60
      sql_timeout: 10

# 本地未启用 FCM，但保留统一节点以明确功能状态。
firebase:
  enabled: false
  credential_file: "./firebase-adminsdk.json"
  time_to_live: 3600

# 开发集群的一对一和群组通话全部使用 Agora。
calls:
  enabled: true
  app_id: "b547e4eff8274ca5ab14b4015f3b0105"
  app_certificate: "74e69faed5d143df9ad4850e1fd542a0"

cluster_config:
  cluster_id: im-local-development
  expected_replicas: 3
  initial_members:
    - one
    - two
    - three
  self: ""
  advertise_addr: ""
  nodes:
    - name: one
      addr: 127.0.0.1:12000
    - name: two
      addr: 127.0.0.1:12001
    - name: three
      addr: 127.0.0.1:12002
  control_plane:
    provider: etcd
    # 对应 Docker 三成员 etcd 映射到宿主机的客户端端口。
    endpoints:
      - http://127.0.0.1:2379
      - http://127.0.0.1:22379
      - http://127.0.0.1:32379
    namespace: /im/local-development
  transport:
    listen: 127.0.0.1:12000
