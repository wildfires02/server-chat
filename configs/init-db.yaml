# 数据库初始化工具的最小 YAML 配置。
#
# 环境变量覆盖规则与主服务一致，例如：
#   IM_STORE_CONFIG__USE_ADAPTER=mysql
#   IM_STORE_CONFIG__ADAPTERS__MYSQL__DSN='root:password@tcp(localhost)/im?parseTime=true'

p2p_delete_enabled: true

store_config:
  uid_key: la6YsO+bNX/+XIkOqc5Svw==
  use_adapter: ""
  adapters:
    postgres:
      database: im
      dsn: postgresql://postgres:postgres@localhost:5432/im?sslmode=disable
    mysql:
      database: im
      dsn: root@tcp(localhost)/im?parseTime=true&collation=utf8mb4_unicode_ci
    rethinkdb:
      database: im
      addresses: localhost:28015
    mongodb:
      database: im
      addresses: localhost:27017
      # replica_set: rs0
      # auth_source: admin
      # username: im
      # password: im
