# Kubernetes 生产集群配置。
# 部署前必须生成包含 Secret 路径和值及节点身份的完整节点 YAML。
log_flags: stdFlags

runtime:
  environment: production
  deployment_mode: cluster

listen: ":6060"
client_origins:
  - https://chat.example.com
api_path: /
cache_control: 39600
ws_compression_disabled: false
static_mount: /
static_data: "-"
grpc_listen: ":16060"
grpc_keepalive_enabled: true
expvar: "-"
server_status: "-"
pprof: ""
pprof_url: ""
health:
  live_path: /livez
  ready_path: /readyz
  drain_path: /drainz
  topology_path: /clusterz
  drain_timeout: 30s
use_x_forwarded_for: true
x_frame_options: DENY
default_country_code: CN

api_key_salt: ""
max_message_size: 4194304
max_subscriber_count: 10000
max_tag_count: 32
permanent_accounts: false
p2p_delete_enabled: true
msg_delete_age: 0
alias_tag: alias

translation:
  enabled: true
  refresh_interval: 5

auth_config:
  logical_names: []
  basic:
    add_to_tags: true
    min_login_length: 3
    min_password_length: 10
  token:
    expire_in: 1209600
    serial_num: 1
    key: ""

store_config:
  uid_key: ""
  max_results: 1024
  use_adapter: postgres
  adapters:
    postgres:
      dsn: ""
      ssl_mode: verify-full
      max_open_conns: 200
      max_idle_conns: 50
      conn_max_lifetime: 300
      sql_timeout: 10

# Pod 本地文件系统不能保存唯一媒体文件。
media:
  use_handler: s3
  max_size: 33554432
  gc_period: 60
  gc_block_size: 100
  handlers:
    s3:
      access_key_id: ""
      secret_access_key: ""
      region: ""
      bucket: ""
      endpoint: ""
      disable_ssl: false
      force_path_style: false
      presign_ttl: 3600
      cache_control: max-age=86400
      cors_origins: []

acc_gc_config:
  enabled: true
  gc_period: 3600
  gc_block_size: 100
  gc_min_account_age: 30

firebase:
  enabled: true
  credential_file: "/etc/im/firebase-adminsdk.json"
  time_to_live: 3600

calls:
  enabled: true
  app_id: ""
  app_certificate: ""

cluster_config:
  cluster_id: im-production
  expected_replicas: 3
  initial_members:
    - im-0
    - im-1
    - im-2
  self: ""
  advertise_addr: ""
  nodes:
    - name: im-0
      addr: im-0.im-headless:12000
    - name: im-1
      addr: im-1.im-headless:12000
    - name: im-2
      addr: im-2.im-headless:12000
    - name: im-3
      addr: im-3.im-headless:12000
    - name: im-4
      addr: im-4.im-headless:12000
  control_plane:
    provider: etcd
    endpoints:
      - https://etcd-0.etcd-headless.infrastructure.svc.cluster.local:2379
      - https://etcd-1.etcd-headless.infrastructure.svc.cluster.local:2379
      - https://etcd-2.etcd-headless.infrastructure.svc.cluster.local:2379
    namespace: /im/production
    lease_ttl: 10s
    dial_timeout: 5s
    username: ""
    password: ""
    tls:
      ca_file: /run/secrets/etcd/ca.pem
      cert_file: /run/secrets/etcd/client.pem
      key_file: /run/secrets/etcd/client-key.pem
      server_name: etcd
  transport:
    listen: 0.0.0.0:12000
    lane_count: 8
    reliable_queue_capacity: 4096
    ephemeral_queue_capacity: 1024
    dial_timeout: 3s
    request_timeout: 5s
    max_retries: 2
    retry_backoff: 100ms
    dedupe_capacity: 65536
    dedupe_ttl: 2m
  tls:
    ca_file: /run/secrets/cluster/ca.pem
    cert_file: /run/secrets/cluster/cert.pem
    key_file: /run/secrets/cluster/key.pem

plugins: []
