apiVersion: v1
kind: Service
metadata:
  name: im-headless
  labels:
    app.kubernetes.io/name: im-server
spec:
  clusterIP: None
  # 冷启动期间也必须解析其他 Pod DNS，Readiness 只控制客户端接流。
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: im-server
  ports:
    - name: cluster-grpc
      port: 12000
      targetPort: cluster-grpc

