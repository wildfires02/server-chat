# Compose 2.24.4+ 的 !override 可避免数据库覆盖后残留 MySQL 配置。
x-mongodb-environment: &mongodb-environment
  IM_CONFIG_FILE: /etc/im/im.cluster.yaml
  IM_STORE_CONFIG__USE_ADAPTER: mongodb
  IM_STORE_CONFIG__ADAPTERS__MONGODB__ADDRESSES: db:27017
  IM_STORE_CONFIG__ADAPTERS__MONGODB__REPLICA_SET: rs0
  IM_DB_WAIT_FOR: db:27017
  IM_DB_WAIT_TIMEOUT: "120"

services:
  db:
    image: ${MONGODB_IMAGE:-mongo:8.0.26}
    environment: !override {}
    command:
      - mongod
      - --bind_ip_all
      - --replSet=rs0
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval 'db.adminCommand("ping").ok' localhost:27017/test
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: !override
      - mongodb-data:/data/db

  mongo-init:
    image: ${MONGODB_IMAGE:-mongo:8.0.26}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - mongosh --host db:27017 --eval 'try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"db:27017"}]}) }'

  db-init:
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment: !override
      <<: *mongodb-environment
      IM_DB_INIT_MODE: ${IM_DB_INIT_MODE:-init}
      IM_DB_SAMPLE_DATA: /opt/im/data.json
      IM_ALLOW_DESTRUCTIVE_DB_RESET: ${IM_ALLOW_DESTRUCTIVE_DB_RESET:-false}
      IM_RUN_SERVER: "false"

  im-0:
    environment: !override
      <<: *mongodb-environment
      IM_DB_INIT_MODE: skip
      IM_CLUSTER_CONFIG__SELF: im-0
      IM_CLUSTER_CONFIG__ADVERTISE_ADDR: im-0:12000
  im-1:
    environment: !override
      <<: *mongodb-environment
      IM_DB_INIT_MODE: skip
      IM_CLUSTER_CONFIG__SELF: im-1
      IM_CLUSTER_CONFIG__ADVERTISE_ADDR: im-1:12000
  im-2:
    environment: !override
      <<: *mongodb-environment
      IM_DB_INIT_MODE: skip
      IM_CLUSTER_CONFIG__SELF: im-2
      IM_CLUSTER_CONFIG__ADVERTISE_ADDR: im-2:12000

volumes:
  mongodb-data:
