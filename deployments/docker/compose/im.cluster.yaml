# Docker Compose 三节点开发集群配置。
# 仅用于本机验证；生产环境使用 configs/im.cluster.yaml 和 Kubernetes。
runtime:
  environment: development
  deployment_mode: cluster

listen: ":6060"
client_origins:
  - http://localhost:3000
api_path: /
cache_control: 39600
ws_compression_disabled: false
static_mount: /
grpc_listen: ":16060"
grpc_keepalive_enabled: true
expvar: /debug/vars
server_status: "-"
health:
  live_path: /livez
  ready_path: /readyz
  drain_path: /drainz
  topology_path: /clusterz
  drain_timeout: 15s
use_x_forwarded_for: false
x_frame_options: SAMEORIGIN
default_country_code: CN

api_key_salt: T713/rYYgW7g4m3vG6zGRh7+FM1t0T8j13koXScOAj4=
max_message_size: 4194304
max_subscriber_count: 1000
max_tag_count: 32
permanent_accounts: false
p2p_delete_enabled: true
msg_delete_age: 0
alias_tag: alias

media:
  use_handler: fs
  max_size: 33554432
  gc_period: 60
  gc_block_size: 100
  handlers:
    fs:
      upload_dir: .local/uploads
      cache_control: max-age=86400
      cors_origins: []

auth_config:
  logical_names: []
  basic:
    add_to_tags: true
    min_login_length: 3
    min_password_length: 6
  token:
    expire_in: 1209600
    serial_num: 1
    key: wfaY2RgF2S1OQI/ZlK+LSrp1KB2jwAdGAIHQ7JZn+Kc=

store_config:
  uid_key: la6YsO+bNX/+XIkOqc5Svw==
  max_results: 1024
  use_adapter: mysql
  adapters:
    mysql:
      dsn: ""
      max_open_conns: 64
      max_idle_conns: 32
      conn_max_lifetime: 60
      sql_timeout: 10
    postgres:
      dsn: ""
      ssl_mode: disable
      max_open_conns: 64
      max_idle_conns: 32
      conn_max_lifetime: 60
      sql_timeout: 10
    mongodb:
      uri: ""
      addresses: db:27017
      database: im
      replica_set: rs0
    rethinkdb:
      addresses: db:28015
      database: im

acc_gc_config:
  enabled: false
  gc_period: 3600
  gc_block_size: 10
  gc_min_account_age: 30

firebase:
  enabled: false
  credential_file: "/etc/im/firebase-adminsdk.json"
  time_to_live: 3600

calls:
  enabled: true
  app_id: "b547e4eff8274ca5ab14b4015f3b0105"
  app_certificate: "74e69faed5d143df9ad4850e1fd542a0"

cluster_config:
  cluster_id: im-compose-development
  expected_replicas: 3
  initial_members:
    - im-0
    - im-1
    - im-2
  self: ""
  advertise_addr: ""
  nodes:
    - name: im-0
      addr: im-0:12000
    - name: im-1
      addr: im-1:12000
    - name: im-2
      addr: im-2:12000
  control_plane:
    provider: etcd
    # 这里是三个 etcd 客户端端点；2380 Peer 端口不能提供给 IM 客户端。
    endpoints:
      - http://etcd-0:2379
      - http://etcd-1:2379
      - http://etcd-2:2379
    namespace: /im/compose-development
    lease_ttl: 10s
    dial_timeout: 3s
  transport:
    listen: 0.0.0.0:12000
    lane_count: 4
    reliable_queue_capacity: 1024
    ephemeral_queue_capacity: 256
    dial_timeout: 2s
    request_timeout: 5s
    max_retries: 2
    retry_backoff: 100ms
    dedupe_capacity: 16384
    dedupe_ttl: 2m

plugins: []
